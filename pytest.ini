[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    requires_model: needs the gitignored model artifacts in ai-model/artifacts (auto-skipped when absent)
    slow: long-running test (golden regression); deselect with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning
