[project]
name = "hast-dss"
version = "1.0.0"
description = "Sistem Pendukung Keputusan Penilaian Kerentanan HAST (SAST + DAST + Random Forest + SHAP + MCDM)"
requires-python = "==3.13.*"
dependencies = [
    # Versi dikunci sesuai lingkungan yang menghasilkan artefak baseline tesis.
    # scikit-learn WAJIB sama dengan versi yang dipakai saat mem-pickle ai-model/artifacts/*.pkl.
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "shap==0.52.0",
    "joblib==1.6.0",
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "requests==2.34.2",
    "streamlit==1.65.0",
    "plotly==7.1.0",
    "matplotlib==3.11.2",
    "openpyxl>=3.1.2",
    "seedir==0.5.1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
