# Konfigurasi CLI Alembic. Aplikasi menerapkan migrasi secara otomatis saat startup
# (backend/db/bootstrap.py); berkas ini hanya untuk pemakaian manual, mis.:
#   uv run alembic upgrade head
#   uv run alembic revision -m "describe change"
# URL basis data diambil dari HAST_DATABASE_URL (lihat backend/core/settings.py).
[alembic]
script_location = backend/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
